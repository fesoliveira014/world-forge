 <title>Rivers, Strahler order, and terminal systems</title>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Rivers, Strahler order, and terminal systems</dc:title>
    <dc:description>Equal-order headwaters produce order 2. Real reservoir spills preserve downstream system identity. A separate ocean mouth and a closed lake are independent terminals. Annual storm runoff alone does not initiate the dashed branch.</dc:description>

 <title>Conservative advection and diffusion</title>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Conservative advection and diffusion</dc:title>
    <dc:description>At dt = 1 second, advective area flux 0.5 m²/s moves 1.5 m³ from A to B. Conductance 0.25 m²/s and the two-metre column difference move another 0.5 m³. Equal-and-opposite updates conserve 11 m³.</dc:description>
